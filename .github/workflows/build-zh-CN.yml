name: Build Husk IPA (zh-CN)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install meson ninja pkg-config xcodegen qemu
          # e2fsprogs 提供 debugfs，仅构建 Android 系统镜像时需要，失败不影响 IPA
          brew install e2fsprogs || true
          rustup target add aarch64-apple-ios

      - name: Build Husk IPA
        run: ./scripts/ci_build.sh

      - name: Show build outputs
        run: ls -lh build/

      - name: Upload IPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Husk-zh-CN-ipa
          path: |
            build/*.ipa
            build/*.tipa
          if-no-files-found: error
